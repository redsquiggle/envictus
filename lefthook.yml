pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,jsx,tsx,json,jsonc}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    check-types:
      run: pnpm check-types
    knip:
      run: pnpm knip --fix
      stage_fixed: true
    test:
      run: pnpm test run

pre-push:
  commands:
    version-check:
      run: |
        local_version=$(node -p "require('./package.json').version")
        published_version=$(npm view envictus version 2>/dev/null || echo "0.0.0")
        if [ "$local_version" = "$published_version" ]; then
          echo "Error: version $local_version is already published. Bump the version in package.json before pushing."
          exit 1
        fi

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
